[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neural-singing-voice-platform"
version = "0.1.0"
description = "A modular, measurable platform for authorized personalized singing voice conversion."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "NSVP Contributors" }]
dependencies = [
  "numpy>=1.26,<2.3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12,<1", "scipy>=1.12,<2", "pyloudnorm>=0.1.1,<1"]
ml = ["torch>=2.3,<3", "torchaudio>=2.3,<3", "torchcrepe>=0.0.23,<1", "pyworld>=0.3.4,<1"]
separation = ["demucs>=4.0.1,<5"]
training = ["mlflow>=3,<4", "psutil>=5.9,<8"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1"]
deployment = ["psycopg[binary]>=3.2,<4"]
directml = ["torch-directml>=0.2.5.dev240914"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<2", "httpx>=0.27,<1"]

[project.scripts]
nsvp = "nsvp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nsvp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires optional runtime dependencies",
  "model: requires pretrained model weights",
  "gpu: requires a supported GPU backend",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nsvp"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchcrepe", "pyworld", "torch_directml", "mlflow", "mlflow.*"]
ignore_missing_imports = true
